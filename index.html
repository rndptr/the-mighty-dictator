<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f5f0" />
  <meta name="description" content="A little space for your words. Dictate, edit and copy with private, on-device speech recognition." />
  <title>The Mighty Dictator</title>
  <script type="module" crossorigin src="./assets/index-BMLH3894.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CFtX_Iel.css">
</head>
<body>
  <main>
    <header>
      <div class="wordmark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <h1>The Mighty Dictator<span class="title-dot">.</span></h1>
      <p class="intro">Your words. A little less typing.</p>
    </header>
    <section class="dictation" aria-label="Dictation">
      <div class="paper">
        <label class="sr-only" for="text">Your text</label>
        <textarea id="text" placeholder="Something on your mind?" spellcheck="true" autocapitalize="sentences"></textarea>
        <div class="text-actions">
          <div class="clear-group"><button id="clear" class="text-button" disabled>Clear</button><button id="undo" class="text-button" hidden>Undo</button></div>
          <button id="copy" class="text-button copy" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></svg>Copy all</button>
        </div>
      </div>
      <div class="record-controls">
        <div class="reserved" aria-hidden="true"></div>
        <button id="microphone" class="microphone" aria-label="Start dictation" aria-pressed="false" aria-describedby="status">
          <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg>
          <span class="stop-icon" aria-hidden="true"></span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
        <div class="reserved" aria-hidden="true"></div>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">Tap to dictate</p>
      <p id="timer" class="timer" aria-hidden="true" hidden>0:00 / 0:29</p>
      <progress id="progress" aria-label="Preparing speech recognition" max="100" hidden></progress>
      <p id="notice" class="notice" role="status" aria-live="polite"></p>
    </section>
    <footer><span class="privacy-dot" aria-hidden="true"></span>On-device with Cactus Whistle <span class="footer-divider" aria-hidden="true">·</span> Up to 29 seconds per clip</footer>
  </main>
</body>
</html>
